name: Checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dataset
      - run: git diff --exit-code -- data/workspace.json data/threads.json data/manifest.json
      - run: npm test
      - run: npm audit --omit=dev
