name: northstar-semantic-search
services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0@sha256:1985314b0ded756ba965e0f400d17406b7a89bec659d4763a490f42f006e4fbd
    hostname: mongodb
    ports:
      - "127.0.0.1:27028:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-search:/data/mongot
    cpus: 2
    mem_limit: 3g
volumes:
  mongo-data:
  mongo-config:
  mongo-search:
